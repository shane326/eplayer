name: Build ePlayer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ePlayer-windows-x64 | Out-Null
          Copy-Item target\release\eplayer.exe dist\ePlayer-windows-x64\ePlayer.exe
          Copy-Item README.md dist\ePlayer-windows-x64\README.md
          Copy-Item sources.example.json dist\ePlayer-windows-x64\sources.example.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ePlayer-windows-x64
          path: dist/ePlayer-windows-x64
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/ePlayer.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          rm -rf dist
          mkdir -p "$MACOS" "$RESOURCES"
          cp target/release/eplayer "$MACOS/ePlayer"
          chmod +x "$MACOS/ePlayer"
          cp README.md "$RESOURCES/README.md"
          cp sources.example.json "$RESOURCES/sources.example.json"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleExecutable</key>
            <string>ePlayer</string>
            <key>CFBundleIdentifier</key>
            <string>com.shane326.eplayer</string>
            <key>CFBundleName</key>
            <string>ePlayer</string>
            <key>CFBundleDisplayName</key>
            <string>ePlayer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ePlayer-macos-arm64
          path: dist/ePlayer.app
          if-no-files-found: error
