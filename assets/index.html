<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ePlayer</title>
    <link rel="stylesheet" href="/styles.css?v=20260531-settings2" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div id="titleText" class="brand">ePlayer</div>
        <nav>
          <button class="nav active" data-view="home">首页</button>
          <button class="nav" data-view="player">播放</button>
        </nav>
        <div class="title-actions">
          <button id="historyBtn" class="icon-btn" title="播放历史" aria-label="播放历史">
            <span class="clock-icon"></span>
          </button>
          <button id="minimizeBtn" class="title-window-btn" title="最小化" aria-label="最小化" type="button">
            <span class="min-icon"></span>
          </button>
          <button id="maximizeBtn" class="title-window-btn" title="最大化" aria-label="最大化" type="button">
            <span class="max-icon"></span>
          </button>
          <button id="closeBtn" class="title-window-btn close" title="关闭" aria-label="关闭" type="button">
            <span class="close-icon"></span>
          </button>
        </div>
      </header>

      <div class="app-body">
        <aside class="app-sidebar">
          <button class="side-nav active" data-side-view="home">首页</button>
          <button class="side-nav" data-side-view="search">搜索</button>
          <div id="parentCategoryList" class="side-section"></div>
          <button id="sideSettingsBtn" class="side-settings" type="button">设置</button>
        </aside>

        <main>
          <section id="homeView" class="view active">
            <section class="content">
              <div class="category-strip-wrap">
                <div id="categoryList" class="category-strip"></div>
              </div>
              <div class="toolbar">
                <div id="libraryInfo" class="muted"></div>
              </div>
              <div id="cards" class="cards"></div>
              <div id="librarySentinel" class="library-sentinel hidden"></div>
            </section>
          </section>

          <section id="searchView" class="view search-view">
            <div class="search-box">
              <input id="searchInput" placeholder="搜索影片" />
              <button id="searchBtn">搜索</button>
            </div>
            <div id="searchResults" class="cards"></div>
          </section>

          <section id="playerView" class="view player-view">
            <div class="player-shell">
              <div id="vodArtContainer" class="art-host"><video id="video" playsinline></video></div>
              <div id="centerState" class="center-state hidden">播放</div>
              <div id="loadingState" class="loading-state hidden">加载中</div>
              <div class="media-controls vod-controls" data-controls-kind="vod">
                <input id="seek" class="control-seek" type="range" min="0" max="1000" value="0" aria-label="播放进度" />
                <div class="control-row">
                  <div class="control-left">
                    <button id="playBtn" class="control-icon play-toggle" aria-label="播放/暂停" title="播放/暂停" type="button"><span class="control-symbol play-symbol"></span></button>
                    <button id="nextEpisodeBtn" class="control-icon next-toggle" aria-label="下一集" title="下一集" type="button"><span class="control-symbol next-symbol"></span></button>
                    <div class="volume-control">
                      <button id="volumeBtn" class="control-icon volume-toggle" aria-label="音量" title="音量" type="button">
                        <svg class="control-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 6a8 8 0 0 1 0 12"></path></svg>
                      </button>
                      <div id="volumePopup" class="volume-popup hidden">
                        <div id="volumeValue" class="volume-value">100</div>
                        <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量" />
                      </div>
                    </div>
                    <div id="timeText" class="control-time">00:00 / 00:00</div>
                  </div>
                  <div class="control-right">
                    <div class="player-settings">
                      <button id="playerSettingsBtn" class="control-icon settings-toggle" aria-label="设置" title="设置" type="button">
                        <svg class="control-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.67 4.14a2.34 2.34 0 0 1 4.66 0 2.34 2.34 0 0 0 3.32 1.91 2.34 2.34 0 0 1 2.33 4.04 2.34 2.34 0 0 0 0 3.82 2.34 2.34 0 0 1-2.33 4.04 2.34 2.34 0 0 0-3.32 1.91 2.34 2.34 0 0 1-4.66 0 2.34 2.34 0 0 0-3.32-1.91 2.34 2.34 0 0 1-2.33-4.04 2.34 2.34 0 0 0 0-3.82 2.34 2.34 0 0 1 2.33-4.04 2.34 2.34 0 0 0 3.32-1.91"></path><circle cx="12" cy="12" r="3"></circle></svg>
                      </button>
                      <div id="playerSettingsPopup" class="player-settings-popup hidden" data-settings-kind="vod">
                        <div class="settings-page active" data-settings-page="main">
                          <button class="settings-menu-row" data-player-settings-page="speed" type="button"><span>播放速度</span><em id="speedLabel">正常</em><b>›</b></button>
                          <button class="settings-menu-row" data-player-settings-page="audio" type="button"><span>音量均衡</span><em id="audioBalanceLabel">关闭</em><b>›</b></button>
                          <button class="settings-menu-row" data-player-settings-page="enhance" type="button"><span>画质增强</span><em id="videoEnhanceLabel">关闭</em><b>›</b></button>
                          <button id="skipBtn" class="settings-menu-row" type="button"><span>跳过片头片尾</span><em>设置跳过配置</em></button>
                          <button class="settings-menu-row" data-player-action="vod-fill" type="button"><span>画面比例</span><em id="fillVideoLabel">原始</em></button>
                          <button class="settings-menu-row" data-player-action="compact" type="button"><span>精简模式</span><em id="compactLabel">开启</em></button>
                          <button class="settings-menu-row" data-player-action="fullscreen" type="button"><span>窗口全屏</span><em id="fullscreenLabel">开启</em></button>
                        </div>
                        <div class="settings-page" data-settings-page="speed">
                          <button class="settings-back" data-player-settings-back type="button">‹ 播放速度</button>
                          <button class="choice-row" data-player-speed="0.5" type="button">0.5</button>
                          <button class="choice-row" data-player-speed="0.8" type="button">0.8</button>
                          <button class="choice-row active" data-player-speed="1" type="button">正常</button>
                          <button class="choice-row" data-player-speed="1.25" type="button">1.3</button>
                          <button class="choice-row" data-player-speed="1.5" type="button">1.5</button>
                          <button class="choice-row" data-player-speed="2" type="button">2.0</button>
                          <button class="choice-row" data-player-speed="3" type="button">3.0</button>
                          <button class="choice-row" data-player-speed="4" type="button">4.0</button>
                        </div>
                        <div class="settings-page" data-settings-page="audio">
                          <button class="settings-back" data-player-settings-back type="button">‹ 音量均衡</button>
                          <button class="choice-row active" data-audio-balance="off" type="button">关闭</button>
                          <button class="choice-row" data-audio-balance="standard" type="button">标准</button>
                          <button class="choice-row" data-audio-balance="strong" type="button">强</button>
                        </div>
                        <div class="settings-page" data-settings-page="enhance">
                          <button class="settings-back" data-player-settings-back type="button">‹ 画质增强</button>
                          <button class="choice-row active" data-video-enhance="off" type="button">关闭</button>
                          <button class="choice-row" data-video-enhance="standard" type="button">标准</button>
                          <button class="choice-row" data-video-enhance="clear" type="button">清晰</button>
                        </div>
                      </div>
                    </div>
                    <button id="compactBtn" class="control-icon compact-toggle" aria-label="精简模式" title="精简模式" type="button"><span class="control-symbol compact-symbol"></span></button>
                    <button id="fullscreenBtn" class="control-icon fullscreen-toggle" aria-label="全屏" title="全屏" type="button"><span class="control-symbol fullscreen-symbol"></span></button>
                  </div>
                </div>
              </div>
              <button id="playSideToggle" class="side-toggle" title="详情">‹</button>
            </div>
            <aside id="playSide" class="play-side drawer-side">
              <div class="side-tabs">
                <button class="side-tab active" data-play-tab="episodes" type="button">选集</button>
                <button class="side-tab" data-play-tab="sources" type="button">换源</button>
                <button class="side-tab" data-play-tab="intro" type="button">简介</button>
              </div>
              <section id="episodesPanel" class="play-side-panel active">
                <div id="episodeHeader" class="episode-header"></div>
                <div id="episodeList" class="episode-list"></div>
              </section>
              <section id="sourcesPanel" class="play-side-panel">
                <div id="sourceCandidateStatus" class="muted">打开剧集后自动搜索可用来源。</div>
                <div id="sourceCandidateList" class="source-candidates"></div>
              </section>
              <section id="introPanel" class="play-side-panel">
                <div id="detailBox" class="detail-box"></div>
              </section>
            </aside>
          </section>
        </main>
      </div>
    </div>

    <div id="settingsDialog" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close-modal="settings"></div>
      <section class="modal-panel settings-modal">
        <header class="settings-header">
          <h2>设置</h2>
          <button id="closeSettingsBtn" class="settings-icon-btn" data-settings-action="close" type="button">×</button>
        </header>
        <nav class="settings-tabs" aria-label="设置分类">
          <button class="settings-tab active" data-settings-tab="vod" type="button">点播资源</button>
          <button class="settings-tab" data-settings-tab="about" type="button">关于</button>
        </nav>
        <section id="vodSettings" class="settings-panel active">
          <h3>点播资源</h3>
          <div class="settings-toolbar">
            <label class="settings-default-row">
              <span>默认源</span>
              <select id="settingsSourceSelect"></select>
            </label>
            <button id="addSourceBtn" data-settings-action="addSource" type="button">新增资源</button>
            <button id="openImportBtn" data-settings-action="openImport" type="button">批量导入</button>
          </div>
          <div id="sourceList" class="settings-source-list"></div>
        </section>
        <section id="aboutSettings" class="settings-panel">
          <h3>关于</h3>
          <div class="settings-card">
            <strong>ePlayer</strong>
            <p class="muted">WebView + hls.js 桌面播放器。</p>
          </div>
          <div class="settings-card">
            <div class="about-row"><span>播放内核</span><strong>hls.js / HTML5 video</strong></div>
            <div class="about-row"><span>点播配置</span><strong>用户数据目录 sources.json</strong></div>
          </div>
        </section>
        <footer class="settings-footer">
          <p id="settingsMsg" class="muted"></p>
          <button id="cancelSettingsBtn" data-settings-action="cancel" type="button">取消</button>
          <button id="saveSettingsBtn" class="primary" data-settings-action="save" type="button">保存</button>
        </footer>
      </section>
    </div>

    <div id="sourceImportDialog" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close-modal="sourceImport"></div>
      <section class="modal-panel import-modal-panel">
        <header class="settings-header">
          <h2>批量导入点播资源</h2>
          <button id="closeSourceImportBtn" class="settings-icon-btn" data-settings-action="closeSourceImport" type="button">×</button>
        </header>
        <textarea id="sourceImport" spellcheck="false" placeholder="粘贴 sources.json 全文"></textarea>
        <footer class="import-footer">
          <button id="cancelSourceImportBtn" data-settings-action="closeSourceImport" type="button">取消</button>
          <button id="importBtn" class="primary" data-settings-action="importSource" type="button">应用</button>
        </footer>
      </section>
    </div>

    <div id="historyPopup" class="history-popup hidden">
      <div class="history-popup-head">
        <strong>播放历史</strong>
        <button id="clearHistoryBtn">清空</button>
        <button id="closeHistoryBtn" class="settings-icon-btn" type="button">×</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>

    <dialog id="skipDialog" class="skip-dialog">
      <div class="skip-dialog-title">跳过片头片尾</div>
      <section class="skip-dialog-body">
        <h3>跳过配置</h3>
        <p>设置后，到达时间会自动跳过或进入下一集</p>
        <div class="skip-form">
          <label><span>片头时间</span><input id="introInput" type="number" min="0" value="0" /><em>秒</em><button id="introCurrentBtn" type="button">当前</button></label>
          <label><span>片尾时间</span><input id="outroInput" type="number" min="0" value="0" /><em>秒</em><button id="outroCurrentBtn" type="button">当前</button></label>
        </div>
        <label class="skip-enable"><input id="skipEnabledInput" type="checkbox" checked />启用自动跳过 <span>片头会跳到指定秒数，片尾按剩余秒数自动下一集</span></label>
        <div class="dialog-actions">
          <form method="dialog"><button id="cancelSkipBtn" type="submit">取消</button></form>
          <button id="clearSkipBtn" type="button">清除</button>
          <button id="saveSkipBtn" type="button">保存</button>
        </div>
      </section>
    </dialog>

    <script src="/artplayer.js?v=20260531-settings2"></script>
    <script src="/flv.min.js?v=20260531-settings2"></script>
    <script src="/app.js?v=20260531-settings2"></script>
  </body>
</html>
